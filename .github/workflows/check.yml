name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 151

      - run: echo "CHROMIUM_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
